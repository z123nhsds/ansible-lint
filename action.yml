---
name: "ansible-lint from main branch"
description: "Run ansible-lint using latest code from main branch"

inputs:
  args:
    description: "Additional arguments to pass to ansible-lint"
    required: false
    default: ""
  requirements_file:
    description: "Path to requirements.txt file for installing additional dependencies"
    required: false
    default: ""
  working_directory:
    description: "Working directory to run ansible-lint in"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: "Checkout code"
      uses: actions/checkout@v4

    - name: "Set up Python 3.14"
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: "Install ansible-lint from main branch"
      run: |
        set -e
        python -m pip install --upgrade pip
        pip install git+https://github.com/ansible/ansible-lint.git@main
        echo "ansible-lint installed successfully"
        ansible-lint --version
      shell: bash

    - name: "Install additional dependencies from requirements file"
      if: ${{ inputs.requirements_file != '' }}
      run: |
        set -e
        if [ -f "${{ inputs.requirements_file }}" ]; then
          echo "Installing dependencies from ${{ inputs.requirements_file }}"
          pip install -r "${{ inputs.requirements_file }}"
        else
          echo "WARNING: Requirements file ${{ inputs.requirements_file }} not found"
        fi
      shell: bash

    - name: "Run ansible-lint"
      run: |
        set -e
        cd "${{ inputs.working_directory }}"
        echo "Running ansible-lint in $(pwd)"
        ansible-lint ${{ inputs.args }}
      shell: bash
