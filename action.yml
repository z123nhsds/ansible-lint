name: run-ansible-lint
description: Run Ansible Lint
author: Ansible by Red Hat <info@ansible.com>
branding:
  icon: shield
  color: red

inputs:
  args:
    description: Arguments to be passed to ansible-lint command.
    required: false
    default: ""
  requirements_file:
    description: Path to the requirements YAML file to install role and collection dependencies.
    required: false
    default: ""
  working_directory:
    description: The directory where to run ansible-lint from. Default is `github.workspace`.
    required: false
    default: ""
  python_version:
    description: The version of Python to use when setting up Python environment. Default is 3.14.
    required: false
    default: "3.14"
  setup_python:
    description: If false, this action will not setup python and will instead rely on the already installed python.
    required: false
    default: "true"
  override_version:
    description: The branch, tag, or commit to use for ansible-lint.
    required: false
    default: ""
  gh_action_ref:
    description: "(Deprecated) Use 'override_version' instead."
    required: false
    default: ""
  expected_return_code:
    description: "(Internal use only) Expected return code from ansible-lint. Default is 0. Used for self-testing purposes."
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Process inputs
      id: inputs
      shell: bash
      run: |
        if [[ -n "${{ inputs.working_directory }}" ]]; then
          echo "working_directory=${{ inputs.working_directory }}" >> "$GITHUB_OUTPUT"
        else
          echo "working_directory=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Determine ansible-lint ref
      id: determine_ref
      shell: bash
      env:
        OVERRIDE_VER: ${{ inputs.override_version }}
        OLD_REF: ${{ inputs.gh_action_ref }}
        GITHUB_ACTION_REF_DISAMBIGUATED: ${{ github.action_ref }}
      run: |
        action_ref="${OVERRIDE_VER:-${OLD_REF:-${GITHUB_ACTION_REF_DISAMBIGUATED:-main}}}"
        if [[ -n "${OLD_REF}" ]]; then
          echo "::warning::Using input 'gh_action_ref': Loading ansible-lint version ${action_ref}. This input is deprecated; please use 'override_version' instead."
        else
          echo "Using ansible-lint ref: ${action_ref}"
        fi
        echo "action_ref=${action_ref}" >> "$GITHUB_OUTPUT"
        echo "ACTION_REF=${action_ref}" >> "$GITHUB_ENV"

    - name: Generate .git/ansible-lint-requirements.txt
      id: get_reqs
      shell: bash
      env:
        GH_ACTION_REF: ${{ steps.determine_ref.outputs.action_ref }}
      working-directory: ${{ steps.inputs.outputs.working_directory }}
      run: |
        repo_root=$(git rev-parse --show-toplevel 2>/dev/null || echo "${{ steps.inputs.outputs.working_directory }}")
        reqs_file="${repo_root}/.git/ansible-lint-requirements.txt"
        echo "reqs_file=${reqs_file}" >> "$GITHUB_OUTPUT"

        mkdir -p "$(dirname "${reqs_file}")"

        download_url="https://raw.githubusercontent.com/ansible/ansible-lint/${GH_ACTION_REF}/.config/requirements-lock.txt"
        if ! wget --output-document="${reqs_file}" "${download_url}" 2>/dev/null; then
          echo "::warning::Failed to download requirements-lock.txt from ${download_url}. Falling back to pip without lock file."
          rm -f "${reqs_file}"
        fi

    - name: Set up uv
      if: inputs.setup_python == 'true'
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python_version }}

    - name: Install ansible-lint
      shell: bash
      env:
        GH_ACTION_REF: ${{ steps.determine_ref.outputs.action_ref }}
        SETUP_PYTHON: ${{ inputs.setup_python }}
        PYTHON_VERSION: ${{ inputs.python_version }}
        REQS_FILE: ${{ steps.get_reqs.outputs.reqs_file }}
      run: |
        chmod +x "${{ github.action_path }}/scripts/run-ansible-lint.sh"
        "${{ github.action_path }}/scripts/run-ansible-lint.sh" install

    - name: Install role and collection dependencies from requirements file
      if: inputs.requirements_file != ''
      shell: bash
      working-directory: ${{ steps.inputs.outputs.working_directory }}
      run: |
        if ! ansible-galaxy install -r "${{ inputs.requirements_file }}"; then
          echo "::error::Failed to install dependencies from ${{ inputs.requirements_file }}"
          exit 1
        fi

    - name: Run ansible-lint
      shell: bash
      working-directory: ${{ steps.inputs.outputs.working_directory }}
      env:
        ANSIBLE_LINT_ARGS: ${{ inputs.args }}
        EXPECTED_RETURN_CODE: ${{ inputs.expected_return_code }}
      run: |
        chmod +x "${{ github.action_path }}/scripts/run-ansible-lint.sh"
        "${{ github.action_path }}/scripts/run-ansible-lint.sh" lint
