---
name: ansible-lint
description: Run Ansible Lint with Python 3.14, installed dynamically from Git main branch
author: Ansible by Red Hat <info@ansible.com>
branding:
  icon: shield
  color: red
inputs:
  args:
    description: >
      Arguments to pass to the ansible-lint command.
      Example: "--nocolor -v --exclude roles/"
    required: false
    default: ""
  requirements_file:
    description: >
      Path to an Ansible Galaxy requirements YAML file for installing
      roles and collections before linting.
    required: false
    default: ""
  working_directory:
    description: >
      Directory from which ansible-lint is executed.
      Defaults to github.workspace when empty.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve working directory
      id: resolve
      shell: bash
      run: |
        WD="${{ inputs.working_directory }}"
        if [[ -z "${WD}" ]]; then
          WD="${{ github.workspace }}"
        fi
        if [[ ! -d "${WD}" ]]; then
          echo "::error::working_directory does not exist: ${WD}"
          exit 1
        fi
        echo "working_directory=${WD}" >> "${GITHUB_OUTPUT}"

    - name: Setup Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Upgrade pip and install ansible-lint from Git main branch
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::pip upgrade"
        python3 -m pip install --upgrade pip
        echo "::endgroup::"

        echo "::group::install ansible-lint from git+https://github.com/ansible/ansible-lint@main"
        pip install "ansible-lint @ git+https://github.com/ansible/ansible-lint@main"
        echo "::endgroup::"

        echo "::group::verify installation"
        ansible-lint --version
        echo "::endgroup::"

    - name: Install Ansible Galaxy dependencies
      if: inputs.requirements_file != ''
      shell: bash
      working-directory: ${{ steps.resolve.outputs.working_directory }}
      run: |
        REQS="${{ inputs.requirements_file }}"
        REQS_PATH="${REQS}"
        if [[ "${REQS}" != /* ]]; then
          REQS_PATH="${{ steps.resolve.outputs.working_directory }}/${REQS}"
        fi
        if [[ ! -f "${REQS_PATH}" ]]; then
          echo "::error::requirements_file not found: ${REQS_PATH}"
          exit 3
        fi
        echo "::group::ansible-galaxy install"
        ansible-galaxy install -r "${REQS_PATH}"
        echo "::endgroup::"

    - name: Run ansible-lint
      id: lint
      shell: bash
      working-directory: ${{ steps.resolve.outputs.working_directory }}
      env:
        ANSIBLE_LINT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        ARGS="${ANSIBLE_LINT_ARGS}"
        EXIT_CODE=0

        echo "::group::ansible-lint execution"
        if [[ -z "${ARGS}" ]]; then
          ansible-lint || EXIT_CODE=$?
        else
          IFS=' ' read -ra SPLIT_ARGS <<< "${ARGS}"
          ansible-lint "${SPLIT_ARGS[@]}" || EXIT_CODE=$?
        fi
        echo "::endgroup::"

        if [[ ${EXIT_CODE} -ne 0 ]]; then
          echo "::error::ansible-lint failed with exit code ${EXIT_CODE}"
        fi
        echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"
        exit ${EXIT_CODE}