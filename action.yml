---
name: run-ansible-lint
description: Run ansible-lint from the main branch with a managed Python 3.14 runtime
author: Ansible by Red Hat <info@ansible.com>
branding:
  icon: shield
  color: red
inputs:
  args:
    description: Arguments passed to the ansible-lint command.
    required: false
    default: ""
  requirements_file:
    description: Path to an Ansible Galaxy requirements file, relative to working_directory or absolute.
    required: false
    default: ""
  working_directory:
    description: Directory where ansible-lint runs. Relative paths resolve from github.workspace.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: |
          ${{ github.action_path }}/pyproject.toml
          ${{ github.action_path }}/.pre-commit-config.yaml

    - name: Run ansible-lint
      shell: bash
      env:
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: bash "${ACTION_PATH}/tools/action-entrypoint.sh"
