---
# For use with pre-commit.
# See usage instructions at http://pre-commit.com

- id: ansible-lint
  # keep name lowercase for consistency with other hook names
  name: ansible-lint
  description: This hook runs ansible-lint.
  entry: python3 -m ansiblelint -v --force-color
  language: python
  # version is needed to avoid accidental use of python3.10 on some platforms
  # as this is not supported by recent versions of ansible-lint and ansible-core
  language_version: python3.14
  # do not pass files to ansible-lint, see:
  # https://github.com/ansible/ansible-lint/issues/611
  pass_filenames: false
  always_run: true
  additional_dependencies:
    # https://github.com/pre-commit/pre-commit/issues/1526
    # If you want to use a specific version of ansible-core or ansible, feel
    # free to override `additional_dependencies` in your own hook config
    # file as we only support latest stable version of ansible-core when used
    # as an action.
    - ansible-core>=2.19.0

- id: ansible-lint-collections
  name: ansible-lint (with collections)
  description: >
    This hook runs ansible-lint with ANSIBLE_COLLECTIONS_PATHS and PYTHONPATH
    preserved from the parent process. Use this variant when you rely on
    collections installed by ansible-galaxy (e.g. via a GitHub Action).
    Requires ansible-galaxy to be available on $PATH.
  entry: tools/ansible-lint-hook.sh
  language: script
  pass_filenames: false
  always_run: true
  require_serial: true
